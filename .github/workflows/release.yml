# On a v* tag: run the tests, zip the mod and publish a GitHub release with the zip.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: node --test test/sg-rules.test.js
      - name: Check that the tag matches the modinfo version
        run: |
          version=$(sed -n 's/.*<Mod id="settlement-gifting" version="\([^"]*\)".*/\1/p' mod/settlement-gifting/settlement-gifting.modinfo)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match modinfo version $version"
            exit 1
          fi
      - name: Package
        run: scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip workshop/preview.png --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
