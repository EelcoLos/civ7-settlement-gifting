# Manual: test, zip the mod and publish a GitHub release tagged v<modinfo version> on the chosen ref.
name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Package
        run: scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' mod/settlement-gifting/settlement-gifting.modinfo)
          if ! grep -q "^## $version\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          awk -v v="$version" '$0 ~ "^## "v {f=1; next} /^## /{f=0} f' CHANGELOG.md > dist/notes.md
          gh release create "v$version" dist/*.zip workshop/preview.png --target "$GITHUB_SHA" --title "v$version" --notes-file dist/notes.md
